name: Test CaseZero
on:
  push:
    branches: [casezero-rebuild]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Run CaseZero logic tests
        run: node --test tests/casezero.test.cjs
      - name: Install browser test dependencies
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke test
        run: node tests/browser-smoke.cjs
