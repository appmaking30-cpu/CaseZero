name: CaseZero Android standalone APK

on:
  workflow_dispatch:
  push:
    branches: [casezero-development]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "original-projects/BothHauntingProjects/artifacts/casezero/**"
      - "original-projects/BothHauntingProjects/pnpm-lock.yaml"
      - "original-projects/BothHauntingProjects/pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: casezero-android-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-standalone-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: original-projects/BothHauntingProjects
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10
        run: npm install --global pnpm@10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the Expo app
        run: pnpm --filter @workspace/casezero run typecheck

      - name: Run the CaseZero unit-test suite
        run: pnpm --filter @workspace/scripts test

      - name: Generate the Android native project
        run: CI=1 pnpm --filter @workspace/casezero exec expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Build standalone release APK with embedded JavaScript bundle
        working-directory: original-projects/BothHauntingProjects/artifacts/casezero/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify standalone APK payload
        working-directory: original-projects/BothHauntingProjects/artifacts/casezero/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fxq "AndroidManifest.xml"
          unzip -Z1 "$APK" | grep -Fxq "assets/index.android.bundle"
          unzip -Z1 "$APK" | grep -q "^lib/arm64-v8a/"
          BUNDLE_BYTES=$(unzip -p "$APK" assets/index.android.bundle | wc -c)
          APK_BYTES=$(stat -c%s "$APK")
          test "$BUNDLE_BYTES" -gt 1000000
          {
            echo "### Standalone APK payload verification"
            echo "- APK bytes: $APK_BYTES"
            echo "- Embedded JavaScript bundle bytes: $BUNDLE_BYTES"
            echo "- Android manifest: present"
            echo "- arm64-v8a native libraries: present"
            echo "- Package ID: temporary Expo default until a permanent ID is selected"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: casezero-standalone-apk
          path: original-projects/BothHauntingProjects/artifacts/casezero/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
