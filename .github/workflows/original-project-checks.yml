name: Original CaseZero workspace checks

on:
  push:
    branches: [casezero-original-work]
    paths:
      - "original-projects/BothHauntingProjects/artifacts/casezero/**"
      - "original-projects/BothHauntingProjects/lib/**"
      - "original-projects/BothHauntingProjects/scripts/**"
      - "original-projects/BothHauntingProjects/pnpm-lock.yaml"
      - "original-projects/BothHauntingProjects/pnpm-workspace.yaml"
      - ".github/workflows/original-project-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casezero-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: original-projects/BothHauntingProjects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm 10
        run: npm install --global pnpm@10
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the CaseZero Expo app
        run: pnpm --filter @workspace/casezero run typecheck
      - name: Test Case 001 deduction rules
        run: pnpm --filter @workspace/scripts test
      - name: Export Android-friendly web preview
        run: pnpm --filter @workspace/casezero exec expo export --platform web
        env:
          EXPO_NO_TELEMETRY: 1
      - name: Install browser test dependency outside the workspace
        run: npm install --prefix /tmp/casezero-browser playwright@1.56.1
      - name: Install Chromium
        run: /tmp/casezero-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run mobile tutorial smoke test
        run: |
          python3 -m http.server 4173 --directory artifacts/casezero/dist >/tmp/casezero-http.log 2>&1 &
          echo $! >/tmp/casezero-http.pid
          node scripts/tests/browser-smoke.cjs
      - name: Upload actual mobile preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casezero-mobile-preview
          path: /tmp/casezero-*.png
          if-no-files-found: ignore
