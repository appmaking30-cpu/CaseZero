name: Original CaseZero workspace checks

on:
  push:
    branches: [casezero-original-work]
    paths:
      - "original-projects/BothHauntingProjects/artifacts/casezero/**"
      - "original-projects/BothHauntingProjects/lib/**"\n      - "original-projects/BothHauntingProjects/scripts/**"
      - "original-projects/BothHauntingProjects/pnpm-lock.yaml"
      - "original-projects/BothHauntingProjects/pnpm-workspace.yaml"
      - ".github/workflows/original-project-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casezero-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: original-projects/BothHauntingProjects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm 10
        run: npm install --global pnpm@10
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the CaseZero Expo app
        run: pnpm --filter @workspace/casezero run typecheck
      - name: Export Android-friendly web preview
        run: pnpm --filter @workspace/casezero exec expo export --platform web
