kind = "mobile"
previewPath = "/"
title = "CaseZero: Beyond the Evidence"
description = "A cinematic, offline-first detective mystery game with a complete original tutorial case, evidence inspection, suspects, deductions, hints, journal and saved investigation progress."
version = "1.0.0"
id = "artifacts/casezero"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21232

[services.development]
run = "pnpm --filter @workspace/casezero run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/casezero", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/casezero", "run", "serve" ]

[services.env]
PORT = "21232"
BASE_PATH = "/"
